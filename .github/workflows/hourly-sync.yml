# Vercel's Hobby plan only runs cron jobs once a day (that daily run is in vercel.json, as a backup).
# This free GitHub Action calls the same endpoint every hour instead.
# Set two repository secrets (Settings → Secrets and variables → Actions):
#   SEMSYNC_URL   e.g. https://semsync.vercel.app
#   CRON_SECRET   the same value as CRON_SECRET in your Vercel project settings
name: Hourly sync

on:
  schedule:
    # Three times an hour; each run syncs whoever was last synced over 55 minutes ago, so everyone is synced about
    # hourly and no single run has everyone. GitHub may start a run a few minutes late, or skip one when it's busy.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sync everyone who is due
        env:
          SEMSYNC_URL: ${{ secrets.SEMSYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SEMSYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the SEMSYNC_URL and CRON_SECRET repository secrets to turn on hourly syncing."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SEMSYNC_URL/api/cron"
