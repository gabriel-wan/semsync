# Runs the sync once, when you ask: Actions → Sync now → Run workflow. Handy for checking the endpoint and secret work.
# The regular schedule is Supabase's own (src/lib/scheduler.ts), set up by every production deploy.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SEMSYNC_URL   e.g. https://semsync.live
#   CRON_SECRET   the same value as CRON_SECRET in your Vercel project settings
name: Sync now

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sync everyone who is due
        env:
          SEMSYNC_URL: ${{ secrets.SEMSYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SEMSYNC_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the SEMSYNC_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SEMSYNC_URL/api/cron"
