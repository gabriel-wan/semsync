name = "semsync"
main = "src/index.tsx"
compatibility_date = "2026-10-01"

# Static files (og.png for link previews). Served before the Worker when the path matches a file.
[assets]
directory = "./public"

# Every 10 minutes, sync the users who are due (each user is synced about once an hour).
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "semsync"
# Replace with the id printed by `wrangler d1 create semsync` before deploying.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
APP_NAME = "Semsync"
# How many users one cron run syncs. Keep it small on the Workers Free plan (10 ms CPU per run).
SYNC_BATCH = "3"
# Extra Canvas hosts allowed besides *.instructure.com, comma separated.
ALLOWED_CANVAS_HOSTS = "canvas.nus.edu.sg"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars for local dev):
#   SESSION_SECRET, ENCRYPTION_KEY,
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET,
#   GOOGLE_SERVICE_ACCOUNT_JSON
# Local-only switches: DEV_LOGIN=1, FAKE_GOOGLE=1
